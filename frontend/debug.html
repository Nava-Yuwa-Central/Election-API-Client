<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Debug - Nepal Entity Service</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .debug-output { background: #f5f5f5; padding: 10px; white-space: pre-wrap; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🇳🇵 Nepal Entity Service - API Debug</h1>
    
    <div class="debug-section">
        <h2>Configuration</h2>
        <div class="debug-output" id="config-output"></div>
    </div>
    
    <div class="debug-section">
        <h2>API Tests</h2>
        <button onclick="testHealth()">Test Health</button>
        <button onclick="testEntities()">Test Entities</button>
        <button onclick="testPersons()">Test Persons</button>
        <button onclick="testParties()">Test Parties</button>
        <div class="debug-output" id="api-output"></div>
    </div>
    
    <div class="debug-section">
        <h2>Raw API Response</h2>
        <div class="debug-output" id="raw-output"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Display configuration
        document.getElementById('config-output').textContent = JSON.stringify(CONFIG, null, 2);
        
        function log(message) {
            const output = document.getElementById('api-output');
            output.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
        }
        
        function logRaw(data) {
            const output = document.getElementById('raw-output');
            output.textContent = JSON.stringify(data, null, 2);
        }
        
        async function testHealth() {
            try {
                log('Testing health endpoint...');
                const response = await fetch('http://localhost:8196/health');
                const data = await response.json();
                log('Health: ' + JSON.stringify(data));
                logRaw(data);
            } catch (error) {
                log('Health Error: ' + error.message);
            }
        }
        
        async function testEntities() {
            try {
                log('Testing entities endpoint...');
                const response = await fetch('http://localhost:8196/api/v1/entities/');
                const data = await response.json();
                log('Entities: ' + data.length + ' items');
                logRaw(data);
            } catch (error) {
                log('Entities Error: ' + error.message);
            }
        }
        
        async function testPersons() {
            try {
                log('Testing persons endpoint...');
                const response = await fetch('http://localhost:8196/api/v1/entities/?entity_type=person&limit=5');
                const data = await response.json();
                log('Persons: ' + data.length + ' items');
                logRaw(data);
            } catch (error) {
                log('Persons Error: ' + error.message);
            }
        }
        
        async function testParties() {
            try {
                log('Testing parties endpoint...');
                const response = await fetch('http://localhost:8196/api/v1/entities/?entity_type=political_party');
                const data = await response.json();
                log('Parties: ' + data.length + ' items');
                logRaw(data);
            } catch (error) {
                log('Parties Error: ' + error.message);
            }
        }
        
        // Auto-test on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                testHealth();
                setTimeout(() => testPersons(), 1000);
            }, 500);
        });
    </script>
</body>
</html>
