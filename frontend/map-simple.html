<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Map Test - Nepal</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
    
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #map { height: 600px; width: 100%; border: 1px solid #ccc; }
        .info { margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 5px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
    </style>
</head>
<body>
    <h1>🇳🇵 Simple Nepal Map Test</h1>
    <div id="status" class="info">Initializing map...</div>
    <div id="map"></div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>
    
    <script>
        const statusDiv = document.getElementById('status');
        
        function updateStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = `info ${type}`;
            console.log(message);
        }
        
        async function initSimpleMap() {
            try {
                updateStatus('Creating map...', 'info');
                
                // Initialize map
                const map = L.map('map').setView([28.3949, 84.1240], 7);
                
                // Add OpenStreetMap tiles
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 10
                }).addTo(map);
                
                // Set Nepal bounds
                const nepalBounds = [[26.3, 80.0], [30.4, 88.2]];
                map.fitBounds(nepalBounds, { padding: [10, 10] });
                
                updateStatus('Map created successfully! Testing GeoJSON loading...', 'success');
                
                // Test GeoJSON loading
                try {
                    updateStatus('Loading district boundaries...', 'info');
                    const response = await fetch('data/NewNepalDistrict.json');
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const geoData = await response.json();
                    updateStatus(`Loaded ${geoData.features.length} district boundaries`, 'success');
                    
                    // Add GeoJSON to map
                    const geoLayer = L.geoJSON(geoData, {
                        style: {
                            fillColor: '#4A90E2',
                            weight: 2,
                            opacity: 1,
                            color: '#2c3e50',
                            fillOpacity: 0.5
                        },
                        onEachFeature: function(feature, layer) {
                            const districtName = feature.properties.DISTRICT || feature.properties.DISTRICT_NAME || 'Unknown';
                            layer.bindPopup(`<strong>${districtName}</strong><br>Click to select this district`);
                            
                            layer.on('click', function() {
                                updateStatus(`Selected: ${districtName}`, 'success');
                            });
                        }
                    }).addTo(map);
                    
                    updateStatus('✅ Map fully functional with district boundaries!', 'success');
                    
                } catch (geoError) {
                    updateStatus(`GeoJSON Error: ${geoError.message}`, 'error');
                    
                    // Try province data as fallback
                    try {
                        updateStatus('Trying province boundaries...', 'info');
                        const provinceResponse = await fetch('data/NewNepalProvince.json');
                        
                        if (!provinceResponse.ok) {
                            throw new Error(`HTTP ${provinceResponse.status}: ${provinceResponse.statusText}`);
                        }
                        
                        const provinceData = await provinceResponse.json();
                        updateStatus(`Loaded ${provinceData.features.length} province boundaries`, 'success');
                        
                        L.geoJSON(provinceData, {
                            style: {
                                fillColor: '#7ED321',
                                weight: 2,
                                opacity: 1,
                                color: '#2c3e50',
                                fillOpacity: 0.5
                            },
                            onEachFeature: function(feature, layer) {
                                const provinceName = feature.properties.province_name || feature.properties.Province || 'Unknown';
                                layer.bindPopup(`<strong>${provinceName} Province</strong>`);
                            }
                        }).addTo(map);
                        
                        updateStatus('✅ Map working with province boundaries!', 'success');
                        
                    } catch (provinceError) {
                        updateStatus(`Province Error: ${provinceError.message}`, 'error');
                        updateStatus('Map working with base tiles only', 'info');
                    }
                }
                
            } catch (error) {
                updateStatus(`Map Error: ${error.message}`, 'error');
            }
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initSimpleMap);
    </script>
</body>
</html>
